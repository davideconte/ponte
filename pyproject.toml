[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ponte-mcp"
dynamic = ["version"]
description = "An end-to-end encrypted bridge between people's coding agents (Claude Code, Codex, any MCP client)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Davide Conte" }]
keywords = ["mcp", "claude-code", "codex", "agents", "collaboration", "end-to-end-encryption"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.26",
  "pydantic>=2.5",
  "mcp>=1.2,<2",
  "anyio>=4",
  "pynacl>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ponte = "ponte.cli:main"

[project.urls]
Homepage = "https://github.com/davideconte/ponte"

[tool.hatch.version]
path = "src/ponte/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ponte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
